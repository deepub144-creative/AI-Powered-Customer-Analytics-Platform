events {}

http {
    server {
        listen 80;

        location / {
            proxy_pass http://dashboard:8501;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location /api/ {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://api:8000;
            proxy_set_header Host $host;
        }
    }
}
