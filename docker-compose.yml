version: '3.8'

services:
  api:
    build: ./api
    container_name: ci-api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/../data
      - ./models:/app/../models
    restart: unless-stopped

  dashboard:
    build: ./dashboard
    container_name: ci-dashboard
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/../data
    depends_on:
      - api
    environment:
      - API_URL=http://api:8000
    restart: unless-stopped
    nginx:
    image: nginx:alpine
    container_name: ci-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - dashboard
    restart: unless-stopped
